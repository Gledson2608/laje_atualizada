<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mega Laje | Calculadora Profissional</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <main class="app-container">
    
    <!-- Lado Esquerdo: Formulário -->
    <section class="glass-panel form-section">
      <div class="header">
        <div class="logo-icon"><i class="fa-solid fa-layer-group"></i></div>
        <h1>Mega Laje</h1>
        <p>Dimensionamento rápido e preciso</p>
      </div>

      <form id="slabForm" autocomplete="off">
        <div class="input-group">
          <label for="slabType"><i class="fa-solid fa-cubes"></i> Tipo de Laje</label>
          <div class="input-wrapper">
            <select id="slabType" required>
              <option value="ceramic">Lajota</option>
              <option value="styrofoam">Isopor</option>
            </select>
          </div>
        </div>

        <div class="row">
          <div class="input-group">
            <label for="length"><i class="fa-solid fa-ruler-horizontal"></i> Comprimento (m)</label>
            <div class="input-wrapper">
              <input type="number" id="length" min="1" max="20" step="0.01" placeholder="Ex: 5.00" required>
            </div>
          </div>

          <div class="input-group">
            <label for="width"><i class="fa-solid fa-ruler-vertical"></i> Largura (m)</label>
            <div class="input-wrapper">
              <input type="number" id="width" min="1" max="20" step="0.01" placeholder="Ex: 3.20" required>
            </div>
          </div>
        </div>

        <div class="row">
          <div class="input-group">
            <label for="beamDirection"><i class="fa-solid fa-arrows-left-right"></i> Direção da Viga</label>
            <div class="input-wrapper">
              <select id="beamDirection" required>
                <option value="length">Comprimento</option>
                <option value="width">Largura</option>
              </select>
            </div>
          </div>

          <!-- Mantive a espessura caso você queira usar para outra coisa no futuro, mas ela não calcula mais concreto -->
          <div class="input-group">
            <label for="slabThickness"><i class="fa-solid fa-layer-group"></i> Espessura (cm)</label>
            <div class="input-wrapper">
              <select id="slabThickness" required>
                <option value="8">8 cm</option>
                <option value="10">10 cm</option>
                <option value="12">12 cm</option>
                <option value="15">15 cm</option>
              </select>
            </div>
          </div>
        </div>

        <button type="submit" class="btn-calculate">
          Calcular Laje <i class="fa-solid fa-calculator"></i>
        </button>
      </form>
    </section>

    <!-- Lado Direito: Resultado -->
    <section class="glass-panel result-section" id="resultSection">
      
      <div class="empty-state" id="emptyState">
        <i class="fa-solid fa-chart-simple empty-icon"></i>
        <p>Preencha os dados ao lado para visualizar o dimensionamento.</p>
      </div>

      <div id="result" class="result-content" style="display: none;">
        
        <!-- Aviso de Vão Livre -->
        <div id="alertWarning" class="warning-alert" style="display: none;">
          <i class="fa-solid fa-triangle-exclamation"></i>
          <p id="warningText"></p>
        </div>

        <h2><i class="fa-solid fa-clipboard-check"></i> Resultado</h2>
        
        <!-- Desenho Esquemático da Laje -->
        <div class="drawing-container">
          <canvas id="slabCanvas"></canvas>
        </div>

        <div class="result-card">
          <div class="res-item">
            <span class="res-label">Vigas necessárias</span>
            <span class="res-value"><span id="beams">0</span> <small>un</small></span>
          </div>
          <div class="res-item">
            <span class="res-label">Tamanho da viga</span>
            <span class="res-value"><span id="beamSize">0.00</span> <small>m</small></span>
          </div>
          <!-- Área total é o último item agora, então ganha o destaque laranja -->
          <div class="res-item highlight">
            <span class="res-label">Área total</span>
            <span class="res-value"><span id="squareMeters">0.00</span> <small>m²</small></span>
          </div>
        </div>

        <div class="info-alert">
          <i class="fa-solid fa-circle-info"></i>
          <p>Cálculo baseado no ajuste de múltiplos de 20cm para as vigas.</p>
        </div>
      </div>

    </section>

  </main>

  <script src="calcular.js"></script>
  <script src="script.js"></script>
</body>
</html>
